[gitlab]
url = https://gitlab.com
# Your personal GitLab access token. This is now read from the config file.
token = YOUR_GITLAB_TOKEN
# Add the GitLab group IDs for your prod and non-prod projects.
# The --update command will use these to fetch all the projects within them.
prod_group_id = YOUR_PROD_GROUP_ID
non_prod_group_id = YOUR_NON_PROD_GROUP_ID

[defaults]
# Default behavior for merging.
# csv_strategy: 'union' for comma-separated values
csv_strategy = union

[ignore]
# Keys to ignore during sync, one per line. Wildcards are supported.
keys = 
    JAVA_OPTS
    *.secret

# ----------------------------------------------------------
# The sections below are managed automatically by the script.
# Run with --update to populate or refresh them.
# ----------------------------------------------------------

[projects_prod]

[projects_non_prod]