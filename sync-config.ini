[gitlab]
url = https://gitlab.com
# Please replace with your actual GitLab group IDs
prod_group_id = 12345
non_prod_group_id = 67890

[ignore]
# Keys to ignore during sync, one per line.
# Wildcards are supported (e.g., *.secret)
JAVA_OPTS
*.secret

[defaults]
# Default behavior for merging.
# strategy: 'replace' or 'keep'
strategy = replace
# csv_strategy: 'union' for comma-separated values
csv_strategy = union